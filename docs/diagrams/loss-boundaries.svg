<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1170" viewBox="0 0 520 1170" role="img" aria-labelledby="title desc"><title id="title">Loss boundaries and unreconciled diagnostics</title><desc id="desc">The same shaded ModelChain AC feeds pre-loss time series and an additional-loss annual branch. The diagnostic sketch is separate and not reconciled.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e2e8f0;font-size:18px}.head{font-size:21px;font-weight:bold}.note{fill:#cbd5e1;font-size:16px}.edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:6 5}</style><rect width="520" height="1170" rx="12" fill="#0f172a"/><text class="head" x="30" y="36">One model output, different boundaries</text><rect x="30" y="60" width="460" height="112" rx="8" fill="#162438" stroke="#34d399" stroke-width="2"/><text x="48" y="90">Shaded ModelChain AC power (W)</text><text x="48" y="118">Already reflects modeled shading,</text><text x="48" y="146">temperature and inverter behavior</text><path class="edge" d="M260 172V210"/><rect x="30" y="210" width="460" height="140" rx="8" fill="#162438" stroke="#22d3ee" stroke-width="2"/><text x="48" y="240">A · BEFORE additional configured losses</text><text x="48" y="268">hourly_ac: AC power in W</text><text x="48" y="296">monthly_ac_kwh: hourly sums / 1000</text><text x="48" y="324">daily_profile: mean power (project: kW)</text><text class="note" x="30" y="366">Monthly energy is NOT the annual total below.</text><path class="edge" d="M490 115H508V445H490"/><rect x="30" y="410" width="460" height="140" rx="8" fill="#162438" stroke="#34d399" stroke-width="2"/><text x="48" y="440">B · Annual branch from the SAME AC</text><text x="48" y="468">Sum hourly power / 1000, then multiply:</text><text x="48" y="496">soiling → mismatch → wiring → availability</text><text x="48" y="524">→ LID → AC-system → near-shading</text><path class="edge" d="M260 550V588"/><rect x="30" y="588" width="460" height="112" rx="8" fill="#162438" stroke="#34d399" stroke-width="2"/><text x="48" y="618">AFTER additional losses</text><text x="48" y="646">annual_ac_kwh + annual yield metrics</text><text x="48" y="674">Financial illustration uses annual energy</text><rect x="30" y="754" width="460" height="112" rx="8" fill="#162438" stroke="#fbbf24" stroke-width="2"/><text x="48" y="784">C · Separate diagnostic sketch</text><text x="48" y="812">Shaded POA × capacity + loss percentages</text><text x="48" y="840">LossTree.compute(); NOT reconciled</text><text class="note" x="30" y="905">Assigned availability/LID are not applied by tree.</text><text class="note" x="30" y="928">Front shading can be counted again in the sketch.</text><text class="note" x="30" y="951">Project grid_kwh is assigned from annual energy;</text><text class="note" x="30" y="974">that assignment is not independent verification.</text><rect x="30" y="1026" width="460" height="112" rx="8" fill="#162438" stroke="#94a3b8" stroke-width="2"/><text x="48" y="1056">Assumptions retained, not repaired</text><text x="48" y="1084">Hourly timestep; 8,760-hour capacity factor</text><text x="48" y="1112">Array time series aggregated by position</text></svg>