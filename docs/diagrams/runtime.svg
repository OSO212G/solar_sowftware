<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1220" viewBox="0 0 520 1220" role="img" aria-labelledby="title desc"><title id="title">Execution and trust boundaries</title><desc id="desc">Offline fixture replaces weather retrieval; historical external paths and local persistent state are separate from the validated input and actual model pipeline.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e2e8f0;font-size:18px}.head{font-size:21px;font-weight:bold}.note{fill:#cbd5e1;font-size:16px}.edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:6 5}</style><rect width="520" height="1220" rx="12" fill="#0f172a"/><text class="head" x="30" y="36">Suria: execution / trust boundaries</text><rect x="30" y="58" width="460" height="84" rx="8" fill="#162438" stroke="#22d3ee" stroke-width="2"/><text x="48" y="88">OFFLINE: synthetic project + CSV specs</text><text x="48" y="116">Clear-sky weather injected at model seam</text><path class="edge" d="M260 142V177"/><rect x="30" y="177" width="460" height="84" rx="8" fill="#162438" stroke="#34d399" stroke-width="2"/><text x="48" y="207">SimulationInput: schema/reference checks</text><text x="48" y="235">Packing / electrical checks are side paths</text><path class="edge" d="M260 261V296"/><rect x="30" y="296" width="460" height="112" rx="8" fill="#162438" stroke="#34d399" stroke-width="2"/><text x="48" y="326">Simulation: equipment parameters</text><text x="48" y="354">Perez POA + infinite-sheds ratios</text><text x="48" y="382">Unshaded and shaded pvlib ModelChains</text><path class="edge" d="M260 408V443"/><rect x="30" y="443" width="460" height="112" rx="8" fill="#162438" stroke="#34d399" stroke-width="2"/><text x="48" y="473">Separate output branches → see next figure</text><text x="48" y="501">Annual energy → illustrative financials</text><text x="48" y="529">Local JSON / SQLite / experimental PDF</text><path class="edge dash" d="M490 100H508V330H490"/><text class="note" x="30" y="586">Cyan path: demo patches get_pvgis_weather.</text><text class="note" x="30" y="609">Dashed side path: weather enters simulation.</text><rect x="18" y="630" width="484" height="224" rx="10" fill="none" stroke="#fbbf24" stroke-dasharray="7 5"/><rect x="30" y="648" width="460" height="140" rx="8" fill="#162438" stroke="#fbbf24" stroke-width="2"/><text x="48" y="678">HISTORICAL LIVE PATHS — not exercised</text><text x="48" y="706">UI address → Nominatim; location → elevation</text><text x="48" y="734">Location → PVGIS → local pickle cache</text><text x="48" y="762">Browser / report imagery → Esri</text><text class="note" x="30" y="817">External responses are not trusted validation.</text><path class="edge dash" d="M18 715H10V330H30"/><text class="note" x="30" y="884">Live weather/cache enters the same simulation.</text><text class="note" x="30" y="907">UI geocoding/elevation sets project site inputs.</text><text class="note" x="30" y="930">Imagery decorates maps/reports, not energy.</text><rect x="30" y="963" width="460" height="84" rx="8" fill="#162438" stroke="#a78bfa" stroke-width="2"/><text x="48" y="993">LOCAL STATE: SQLite project dictionaries</text><text x="48" y="1021">Weather pickle: trusted fresh CWD only</text><rect x="30" y="1070" width="460" height="84" rx="8" fill="#162438" stroke="#94a3b8" stroke-width="2"/><text x="48" y="1100">SIDE BRIDGE: domain/converter.py</text><text x="48" y="1128">Partial mapping; not the active central route</text><text class="note" x="30" y="1181">No cloud storage, battery dispatch or shadow tracer.</text></svg>