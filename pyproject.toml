[project]
name = "suria"
version = "0.1.0"
description = "Solar PV pre-feasibility tool for Malaysia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pvlib>=0.11.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "plotly>=5.18",
    "jupyter>=1.0",
    "streamlit>=1.30",
    "streamlit-folium>=0.20",
    "folium>=0.15",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fpdf2>=2.8",
    "sqlalchemy>=2.0.49",
    "staticmap>=0.5",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["suria*"]

[tool.setuptools.package-data]
suria = ["components/*.csv", "components/*.json"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::RuntimeWarning:scipy.optimize._chandrupatla",
]
